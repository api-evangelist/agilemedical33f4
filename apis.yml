aid: agilemedical33f4
name: Agile Medical
description: 'Agile Medical — 敏捷医疗科技（苏州）有限公司, trading under the AGIBOT brand — is a Chinese
  surgical robotics manufacturer founded in September 2020 and headquartered in Suzhou, Jiangsu, with
  R&D offices in the Suzhou Industrial Park Dushu Lake innovation district and Shanghai Zhangjiang.
  Its flagship AGIBOT endoscopic (laparoscopic) surgical robot system pairs a surgeon console, an
  eight-degree-of-freedom patient-side platform and an imaging processing platform that ingests
  third-party ultrasound, CT and endoscopic sources. The system received NMPA Class III medical device
  approval in March 2025 and is in clinical use for minimally invasive urology, gynecology, general,
  hepatobiliary and thoracic procedures. The company closed a several-hundred-million-RMB Series B in
  October 2025. It sells regulated capital equipment to hospitals and publishes no public API,
  developer portal, SDK or machine-readable specification.'
